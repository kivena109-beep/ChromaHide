<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivenioo Pixels</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0d1117; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #game-container { width: 100%; max-width: 900px; height: 95vh; background: #161b22; border-radius: 20px; border: 1px solid #30363d; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .screen { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 30px; text-align: center; }
        .screen.active { display: flex; }
        h1 { font-size: 2.5rem; color: #58a6ff; margin-bottom: 10px; }
        p { color: #8b949e; margin-bottom: 20px; }
        input, select { width: 100%; max-width: 350px; padding: 12px; margin-bottom: 15px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 8px; font-size: 1rem; }
        .row { display: flex; gap: 10px; width: 100%; max-width: 350px; margin-bottom: 15px; }
        .row input { margin-bottom: 0; }
        .btn { width: 100%; max-width: 350px; padding: 12px; background: #238636; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-bottom: 10px; transition: 0.2s; }
        .btn:hover { background: #2ea043; }
        .btn-sec { background: #21262d; border: 1px solid #30363d; }
        .btn-sec:hover { background: #30363d; }
        .top-bar { padding: 15px; background: #0d1117; display: flex; justify-content: space-between; border-bottom: 1px solid #30363d; width: 100%; font-weight: bold; }
        #gameCanvas { flex-grow: 1; background: #21262d; cursor: crosshair; }
        .palette { padding: 10px; background: #0d1117; display: flex; justify-content: center; gap: 10px; border-top: 1px solid #30363d; width: 100%; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
        #timerDisplay { color: #ff4757; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="game-container">

    <!-- 1. شاشة البداية -->
    <div id="setupScreen" class="screen active">
        <h1>Kivenioo Pixels</h1>
        <p>أدخل بياناتك للبدء</p>
        <input type="text" id="playerName" placeholder="اسم اللاعب (Nickname)">
        <button class="btn" onclick="goToMenu()">دخول للوبي (Enter Lobby)</button>
    </div>

    <!-- 2. اللوبي واختيار السيرفر والمود -->
    <div id="lobbyScreen" class="screen">
        <h1>اللوبي (Lobby)</h1>
        <p id="userGreeting"></p>
        
        <select id="serverSelect">
            <option value="ME">سيرفر الشرق الأوسط (Middle East)</option>
            <option value="EU">سيرفر أوروبا (Europe)</option>
            <option value="US">سيرفر أمريكا (USA)</option>
        </select>

        <button class="btn" onclick="openSettings('virtual')">لعب مع الكمبيوتر (Play Virtual)</button>
        <button class="btn btn-sec" onclick="openSettings('online')">إنشاء غرفة أونلاين (Create Room)</button>
        
        <div class="row" style="margin-top: 15px;">
            <input type="text" id="roomCodeInput" placeholder="كود الغرفة للانضمام">
            <button class="btn btn-sec" style="width: auto;" onclick="joinExistingRoom()">Join</button>
        </div>
    </div>

    <!-- 3. إعدادات المباراة (كم متخفي وكم صياد) -->
    <div id="settingsScreen" class="screen">
        <h1>إعدادات المباراة (Match Settings)</h1>
        <p>حدد أعداد اللاعبين</p>
        <div class="row">
            <input type="number" id="hidersCount" placeholder="عدد المتخفين (Hiders)" min="1" max="5" value="1">
            <input type="number" id="huntersCount" placeholder="عدد الصيادين (Hunters)" min="1" max="5" value="1">
        </div>
        <select id="myChosenRole">
            <option value="Hider">أريد أن ألعب كـ: متخفي (Hider)</option>
            <option value="Hunter">أريد أن ألعب كـ: صياد (Hunter)</option>
        </select>
        <button class="btn" onclick="startMatch()">ابدأ المباراة (Start Match)</button>
        <button class="btn btn-sec" onclick="switchScreen('lobbyScreen')">رجوع (Back)</button>
    </div>

    <!-- 4. شاشة اللعب -->
    <div id="gameScreen" class="screen" style="padding:0;">
        <div class="top-bar">
            <span id="roomDisplay"></span>
            <span id="timerDisplay">الوقت: 60</span>
            <span id="roleDisplay" style="color: #58a6ff;"></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="palette" id="colorPalette">
            <div class="color-dot" style="background: #ff4757;" onclick="currentColor='#ff4757'"></div>
            <div class="color-dot" style="background: #2ed573;" onclick="currentColor='#2ed573'"></div>
            <div class="color-dot" style="background: #1e90ff;" onclick="currentColor='#1e90ff'"></div>
            <div class="color-dot" style="background: #ffffff;" onclick="currentColor='#ffffff'"></div>
            <div class="color-dot" style="background: #000000;" onclick="currentColor='#000000'"></div>
        </div>
    </div>

</div>

<script>
    // --- إعدادات Firebase (ضع مفاتيحك هنا لاحقاً للأونلاين) ---
    // يمكنك تركها فارغة الآن وسيعمل "اللعب مع الكمبيوتر" بامتياز!
    /*
    const firebaseConfig = { apiKey: "...", authDomain: "..." };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    */

    let currentUser = {};
    let currentGameMode = ""; // 'virtual' أو 'online'
    let myRole = ""; 
    let currentColor = "#ff4757";
    let gamePhase = "hiding"; // 'hiding' ثم 'hunting'
    let timeRemaining = 60;
    let timerInterval;
    let botInterval;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function goToMenu() {
        const name = document.getElementById('playerName').value.trim();
        if(!name) return alert('أدخل اسمك أولاً!');
        currentUser.name = name;
        document.getElementById('userGreeting').innerText = `أهلاً ${currentUser.name}!`;
        switchScreen('lobbyScreen');
    }

    function openSettings(mode) {
        currentGameMode = mode;
        switchScreen('settingsScreen');
    }

    function startMatch() {
        myRole = document.getElementById('myChosenRole').value;
        const server = document.getElementById('serverSelect').options[document.getElementById('serverSelect').selectedIndex].text;
        
        document.getElementById('roomDisplay').innerText = `السيرفر: ${server} | الوضع: ${currentGameMode === 'virtual' ? 'Bots' : 'Online'}`;
        document.getElementById('roleDisplay').innerText = `دورك: ${myRole}`;
        
        switchScreen('gameScreen');
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height); // تنظيف الشاشة

        startGameLogic();
    }

    function startGameLogic() {
        // ضبط المرحلة الأولى: التخفي (60 ثانية)
        gamePhase = "hiding";
        timeRemaining = 60;
        updateTimerUI();

        // إخفاء الألوان عن الصياد
        document.getElementById('colorPalette').style.display = (myRole === "Hunter") ? 'none' : 'flex';

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerUI();

            if(timeRemaining <= 0) {
                if(gamePhase === "hiding") {
                    // الانتقال لمرحلة الصيد (100 ثانية)
                    gamePhase = "hunting";
                    timeRemaining = 100;
                    alert("انتهى وقت التخفي! ابدأ الصيد!");
                } else {
                    // انتهاء اللعبة
                    clearInterval(timerInterval);
                    clearInterval(botInterval);
                    alert("انتهى الوقت! انتهت المباراة!");
                    switchScreen('lobbyScreen');
                }
            }
        }, 1000);

        setupDrawing();

        // تشغيل الذكاء الاصطناعي لو كنت تلعب ضد الكمبيوتر وأنت الصياد
        if(currentGameMode === 'virtual' && myRole === 'Hunter') {
            startBotsAI();
        }
    }

    function updateTimerUI() {
        const phaseName = gamePhase === "hiding" ? "التخفي" : "الصيد";
        document.getElementById('timerDisplay').innerText = `${phaseName}: ${timeRemaining} ثانية`;
    }

    function setupDrawing() {
        let isDrawing = false;
        canvas.onmousedown = () => isDrawing = true;
        canvas.onmouseup = () => isDrawing = false;
        canvas.onmousemove = (e) => {
            // لا ترسم إذا لم تكن ضاغطاً، أو إذا كنت صياداً، أو انتهى وقت التخفي
            if(!isDrawing || myRole !== "Hider" || gamePhase !== "hiding") return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            renderDraw(x, y, currentColor);
            
            // هنا مستقبلاً كود Firebase لإرسال الرسمة للأونلاين
        };
    }

    function renderDraw(x, y, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
    }

    function startBotsAI() {
        // الكمبيوتر يمثل المتخفين، سيرسم نقاط عشوائية
        botInterval = setInterval(() => {
            if(gamePhase === "hiding") {
                const randomX = Math.random() * canvas.width;
                const randomY = Math.random() * canvas.height;
                const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffffff'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                renderDraw(randomX, randomY, randomColor);
            }
        }, 100); // سرعة رسم البوت
    }

    // دالة للانضمام للغرف مستقبلاً مع Firebase
    function joinExistingRoom() {
        alert("هذه الخاصية ستعمل عندما نضع مفاتيح Firebase الخاصة بك!");
    }
</script>

</body>
</html>
